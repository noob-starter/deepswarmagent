[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "deep-research-swarm-backend"
version = "0.1.0"
description = "Multi-agent deep research backend (LangGraph, LiteLLM, single Postgres)."
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    # psycopg v3 (LangGraph Postgres checkpoint); [binary] bundles libpq for slim Docker images
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.20",
    # LiteLLM's built-in "langfuse" callback expects SDK v2 (v3 removed langfuse.version).
    "langfuse>=2.0.0,<3.0.0",
    "litellm>=1.52.0",
    "httpx>=0.27.0",
    "duckduckgo-search>=6.3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
