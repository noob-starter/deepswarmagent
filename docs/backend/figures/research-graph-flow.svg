<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill: #f4f6fb; stroke: #2d3a5c; stroke-width: 1.5; rx: 8; }
      .startend { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 8; }
      .edge { stroke: #2d3a5c; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: #1a1a2e; }
      .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #1a1a2e; }
    ]]></style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2d3a5c"/>
    </marker>
  </defs>
  <text x="20" y="28" class="title">Research LangGraph: node order</text>
  <rect x="20" y="45" width="72" height="36" class="startend"/>
  <text x="35" y="68" class="label">START</text>
  <rect x="120" y="45" width="100" height="36" class="box"/>
  <text x="145" y="68" class="label">planner</text>
  <rect x="250" y="45" width="130" height="36" class="box"/>
  <text x="270" y="68" class="label">parallel_search</text>
  <rect x="410" y="45" width="80" height="36" class="box"/>
  <text x="430" y="68" class="label">critic</text>
  <!-- branch -->
  <rect x="520" y="20" width="160" height="36" class="box"/>
  <text x="536" y="43" class="label">critic_route_prepare</text>
  <rect x="520" y="90" width="110" height="36" class="box"/>
  <text x="535" y="113" class="label">extract_claims</text>
  <path d="M 490 63 L 520 38" class="edge"/>
  <path d="M 490 63 L 520 108" class="edge"/>
  <text x="490" y="18" class="label" font-size="11">search_again</text>
  <text x="500" y="132" class="label" font-size="11">extract_claims</text>
  <!-- loop back -->
  <path d="M 680 38 L 750 38 L 750 300 L 315 300 L 315 81" class="edge"/>
  <text x="668" y="30" class="label" font-size="11">-&gt; parallel_search</text>
  <rect x="660" y="90" width="100" height="36" class="box"/>
  <text x="678" y="113" class="label">fact_check</text>
  <rect x="785" y="90" width="100" height="36" class="box"/>
  <text x="812" y="113" class="label">synthesize</text>
  <path d="M 630 108 L 660 108" class="edge"/>
  <path d="M 760 108 L 785 108" class="edge"/>
  <rect x="660" y="150" width="120" height="36" class="box"/>
  <text x="672" y="173" class="label">citation_format</text>
  <path d="M 885 126 L 885 140 L 790 140 L 720 150" class="edge"/>
  <rect x="660" y="210" width="72" height="36" class="startend"/>
  <text x="678" y="233" class="label">END</text>
  <path d="M 720 168 L 720 210 L 732 228" class="edge"/>
  <text x="20" y="280" class="label" font-size="12">Conditional after critic: if followups non-empty and round &lt; max_critic_rounds -&gt; search_again; else extract_claims.</text>
  <text x="20" y="305" class="label" font-size="12">All wrapped nodes emit agent_started / agent_completed to research_events (SSE).</text>
</svg>
